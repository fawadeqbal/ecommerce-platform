# CI/CD: verify → build one Docker image → deploy to a server over SSH.
#
# Repository settings → Secrets and variables → Actions:
#   Variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_ADMIN_URL, NEXT_PUBLIC_VENDOR_URL
#              DEPLOY_HOST (leave empty to skip deploy), DEPLOY_USER, DEPLOY_PORT (default 22), DEPLOY_PATH (default /opt/ecommerce)
#   Secrets:   DEPLOY_SSH_KEY (private key whose public key is in the server's ~/.ssh/authorized_keys)
#              GHCR_PULL_TOKEN (optional: PAT with read:packages so the server can pull; defaults to GITHUB_TOKEN)
name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @ecommerce/database exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Build & push Docker image
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"   # registry names must be lowercase
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', steps.tag.outputs.image, github.ref_name) || '' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api/v1' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_ADMIN_URL=${{ vars.NEXT_PUBLIC_ADMIN_URL || 'http://localhost:3001' }}
            NEXT_PUBLIC_VENDOR_URL=${{ vars.NEXT_PUBLIC_VENDOR_URL || 'http://localhost:3002' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: image
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.DEPLOY_USER }}
      PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ecommerce' }}
      TAG: ${{ needs.image.outputs.tag }}
      APP_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
      - name: Upload deploy script
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$PORT" deploy/deploy.sh "$SSH_USER@$HOST:$DEPLOY_PATH/deploy.sh"
      - name: Registry login on server
        run: |
          echo "${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}" | \
            ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$HOST" \
            "APP_DIR='$DEPLOY_PATH' IMAGE='${APP_IMAGE}:${TAG}' DEPLOY_INFRA='${{ vars.DEPLOY_INFRA || 'false' }}' bash '$DEPLOY_PATH/deploy.sh'"
